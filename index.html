<!DOCTYPE html>
<html lang="cs" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌹 Ruženka – Živnostenský Pomocník</title>
<style>
:root {
  --bg:#fff1f3;--surface:#fff;--surface2:#ffe4e8;--border:#fecdd5;
  --primary:#e11d48;--primary-h:#be123c;--primary-l:#fda4b1;
  --text:#1a0a0f;--text2:#6b3344;--muted:#9f6070;
  --user-bg:#e11d48;--user-fg:#fff;--bot-bg:#fff;--bot-fg:#1a0a0f;
  --shadow:0 4px 24px rgba(225,29,72,.12);--shadow-s:0 2px 8px rgba(225,29,72,.08);
  --r:16px;--rs:8px;
}
[data-theme="dark"]{
  --bg:#110409;--surface:#1e0b13;--surface2:#2d1221;--border:#5c1d30;
  --primary:#f43f5e;--primary-h:#fb7089;--primary-l:#9f1239;
  --text:#fdf2f5;--text2:#f9a8ba;--muted:#c8849a;
  --user-bg:#be123c;--user-fg:#fff;--bot-bg:#2d1221;--bot-fg:#fdf2f5;
  --shadow:0 4px 24px rgba(244,63,94,.22);--shadow-s:0 2px 8px rgba(244,63,94,.15);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;line-height:1.55}
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.petal{position:absolute;bottom:-80px;font-size:3rem;opacity:.05;animation:rise linear infinite;user-select:none}
@keyframes rise{from{transform:translateY(0) rotate(0deg);opacity:0}8%{opacity:.05}92%{opacity:.05}to{transform:translateY(-110vh) rotate(360deg);opacity:0}}
.theme-btn{position:fixed;top:1rem;right:1rem;z-index:200;background:var(--surface);border:1.5px solid var(--border);
  border-radius:50%;width:44px;height:44px;cursor:pointer;font-size:1.25rem;display:flex;align-items:center;
  justify-content:center;box-shadow:var(--shadow-s);transition:transform .2s}
.theme-btn:hover{transform:scale(1.1)}
.theme-btn:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.hdr{width:100%;max-width:860px;padding:1.75rem 1.5rem .75rem;text-align:center;position:relative;z-index:1}
.hdr-rose{font-size:3rem;display:block;margin-bottom:.4rem;filter:drop-shadow(0 2px 10px rgba(225,29,72,.35))}
.hdr h1{font-size:1.7rem;font-weight:800;letter-spacing:-.025em;
  background:linear-gradient(135deg,var(--primary),var(--primary-h));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hdr p{color:var(--muted);font-size:.875rem;margin-top:.25rem}
.chat{width:100%;max-width:860px;flex:1;display:flex;flex-direction:column;padding:0 1rem 1rem;position:relative;z-index:1;gap:.7rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{background:var(--surface);border:1.5px solid var(--border);border-radius:20px;padding:.32rem .85rem;
  font-size:.78rem;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .18s;white-space:nowrap}
.chip:hover{background:var(--primary);color:#fff;border-color:var(--primary);transform:translateY(-1px);box-shadow:var(--shadow-s)}
.chip:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.msgs{flex:1;overflow-y:auto;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);
  padding:1.4rem;min-height:420px;max-height:58vh;display:flex;flex-direction:column;gap:1.25rem;
  box-shadow:var(--shadow);scroll-behavior:smooth}
.msgs::-webkit-scrollbar{width:5px}
.msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.row{display:flex;gap:.7rem;animation:fadeUp .28s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.row.u{flex-direction:row-reverse;align-self:flex-end;max-width:80%}
.row.b{align-self:flex-start;max-width:86%}
.av{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;font-size:1.1rem;background:var(--surface2);border:1.5px solid var(--border)}
.bub{padding:.75rem 1.05rem;border-radius:var(--r);font-size:.875rem;line-height:1.7;word-break:break-word}
.row.u .bub{background:var(--user-bg);color:var(--user-fg);border-radius:var(--r) var(--r) 4px var(--r)}
.row.b .bub{background:var(--bot-bg);color:var(--bot-fg);border:1.5px solid var(--border);border-radius:var(--r) var(--r) var(--r) 4px}
.bub b{font-weight:700;color:var(--primary)}
.row.u .bub b{color:rgba(255,255,255,.95)}
.bub h3{font-size:.95rem;font-weight:700;color:var(--primary);margin:.7rem 0 .35rem}
.bub h3:first-child{margin-top:0}
.bub ul{padding-left:1.35rem;margin:.35rem 0}
.bub li{margin-bottom:.25rem}
.bub p{margin-bottom:.45rem}
.bub p:last-child{margin-bottom:0}
.bub .tag{display:inline-block;background:var(--primary);color:#fff;font-size:.7rem;padding:.1rem .45rem;border-radius:10px;font-weight:700;margin-right:.2rem}
.typing-row{display:flex;gap:.7rem;align-self:flex-start;animation:fadeUp .28s ease-out}
.typing-bub{background:var(--bot-bg);border:1.5px solid var(--border);border-radius:var(--r) var(--r) var(--r) 4px;
  padding:.85rem 1.1rem;display:flex;gap:5px;align-items:center}
.td{width:8px;height:8px;background:var(--primary-l);border-radius:50%;animation:tdB 1.4s ease-in-out infinite}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes tdB{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-7px);opacity:1}}
.inp-row{display:flex;gap:.65rem;align-items:flex-end}
.inp-wrap{flex:1}
.inp-wrap textarea{width:100%;padding:.82rem 1rem;border:1.5px solid var(--border);border-radius:var(--rs);
  background:var(--surface);color:var(--text);font-size:.875rem;font-family:inherit;resize:none;
  min-height:52px;max-height:160px;overflow-y:auto;transition:border-color .2s,box-shadow .2s;line-height:1.5}
.inp-wrap textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(225,29,72,.1)}
.inp-wrap textarea::placeholder{color:var(--muted)}
.send-btn{width:52px;height:52px;flex-shrink:0;background:var(--primary);color:#fff;border:none;
  border-radius:var(--rs);font-size:1.35rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .1s,box-shadow .2s}
.send-btn:hover:not(:disabled){background:var(--primary-h);transform:translateY(-1px);box-shadow:var(--shadow-s)}
.send-btn:active:not(:disabled){transform:scale(.95)}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
.send-btn:focus-visible{outline:2px solid var(--primary-h);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:600px){.hdr h1{font-size:1.35rem}.chips{gap:.35rem}.chip{font-size:.73rem;padding:.28rem .7rem}
  .msgs{min-height:340px;max-height:50vh;padding:1rem}.row.u,.row.b{max-width:93%}}
</style>
</head>
<body>
<div class="petals" aria-hidden="true" id="petals"></div>
<button class="theme-btn" id="themeBtn" aria-label="Přepnout téma">🌸</button>

<header class="hdr">
  <span class="hdr-rose" aria-hidden="true">🌹</span>
  <h1>Živnostenský Pomocník</h1>
  <p>Průvodkyně světem živností pro Ruženku 🌸 &nbsp;·&nbsp; funguje offline, zdarma</p>
</header>

<main class="chat" aria-label="Chatbot Ruženka">
  <nav aria-label="Rychlá témata">
    <div class="chips" role="list">
      <button class="chip" data-q="jak zaregistrovat živnost">📋 Registrace</button>
      <button class="chip" data-q="jaké daně musím platit">💰 Daně</button>
      <button class="chip" data-q="pojistné studentka osvč vedlejší">🏥 Pojistné studentky</button>
      <button class="chip" data-q="dpp a živnost zároveň">📄 DPP + živnost</button>
      <button class="chip" data-q="co jsou paušální výdaje">🧾 Paušální výdaje</button>
      <button class="chip" data-q="co se stane po skončení školy">🎓 Po škole</button>
      <button class="chip" data-q="výhody a nevýhody živnosti">⚖️ Výhody vs. nevýhody</button>
      <button class="chip" data-q="jak vystavit fakturu">🧾 Faktura</button>
      <button class="chip" data-q="firma mě nutí k iče švarcsystém">⚠️ Firma nutí k IČO</button>
      <button class="chip" data-q="kolik vydělám čistého kalkulace">🔢 Čistý příjem</button>
    </div>
  </nav>

  <div class="msgs" id="msgsEl" role="log" aria-live="polite"></div>

  <div class="inp-row">
    <div class="inp-wrap">
      <label for="msgIn" class="sr">Napiš zprávu</label>
      <textarea id="msgIn" rows="1" placeholder="Napiš otázku… (Enter = odeslat, Shift+Enter = nový řádek) 🌸"></textarea>
    </div>
    <button class="send-btn" id="sendBtn" aria-label="Odeslat" title="Odeslat">🌹</button>
  </div>
</main>

<script>
// ── KNOWLEDGE BASE ────────────────────────────────────────────────────────────
const KB = [
  {
    keys: ['registr','založ','živnost','ičo','jak si','jak začít','živnostenský úřad','jrf'],
    title: 'Jak si zaregistrovat živnost',
    text: `<p>Postup je jednodušší, než to vypadá – zvládneš ho sama za hodinu 🌸</p>
<h3>Krok za krokem</h3>
<ul>
<li><b>1.</b> Vyplň <b>Jednotný registrační formulář (JRF)</b> – online na <b>gov.cz</b> nebo osobně na živnostenském úřadě</li>
<li><b>2.</b> Přilož: občanský průkaz, adresu provozovny (může být tvoje bydliště)</li>
<li><b>3.</b> Zaplať správní poplatek: <b>volná živnost = ZDARMA</b>, vázaná = 1 000 Kč/obor</li>
<li><b>4.</b> Počkej do <b>5 pracovních dnů</b> → dostaneš živnostenský list a IČO</li>
<li><b>5.</b> Přihlas se na <b>OSSZ</b> (sociální pojišťovna) do <b>8 dnů</b> od zahájení</li>
<li><b>6.</b> Přihlas se na svou <b>zdravotní pojišťovnu</b> do <b>8 dnů</b></li>
</ul>
<h3>Typy živností</h3>
<ul>
<li><b>Volná</b> – IT, administrativa, grafika, marketing, překlady, copywriting, obchod, úklid… → zdarma, bez požadavků</li>
<li><b>Vázaná</b> – účetnictví, průvodce, masér, realitní makléř… → vyžaduje vzdělání, 1 000 Kč/obor</li>
<li><b>Koncesovaná</b> – zbraně, taxi, alkohol… → potřebuješ státní povolení</li>
</ul>
<p>Nejspíš ti bude stačit <b>volná živnost</b> – je nejlevnější a nevyžaduje žádné certifikáty.</p>`
  },
  {
    keys: ['daň','daně','přiznání','základ daně','sazba','15%','odvod','zákon'],
    title: 'Daně – co a kolik zaplatíš',
    text: `<h3>Daň z příjmů fyzických osob</h3>
<ul>
<li>Sazba: <b>15 %</b> ze základu daně</li>
<li>Základ daně = příjmy − výdaje</li>
<li>Daňové přiznání: podat do <b>31. března</b> (nebo 1. července, pokud máš daňového poradce)</li>
</ul>
<h3>Slevy na dani – snižují přímo daň 🌸</h3>
<ul>
<li>Sleva na poplatníka: <b>30 840 Kč/rok</b> – má každý automaticky</li>
<li>Sleva na studenta: <b>4 020 Kč/rok</b> – dokud jsi studentka</li>
<li>Celkem: <b>34 860 Kč/rok</b> v slevách!</li>
</ul>
<h3>Praktický příklad</h3>
<p>Příjmy ze živnosti <b>200 000 Kč</b> + paušální výdaje 60 % = základ daně 80 000 Kč → daň 12 000 Kč → po slevách: <b>daň = 0 Kč</b> ✅</p>
<p>Při příjmech do cca <b>230 000 Kč/rok</b> pravděpodobně nezaplatíš na dani nic (při paušálu 60 %).</p>`
  },
  {
    keys: ['paušální výdaje','paušál','60%','80%','výdaje','náklady','účtenk','evidenc'],
    title: 'Paušální výdaje – nejjednodušší varianta',
    text: `<h3>Co jsou paušální výdaje?</h3>
<p>Místo sbírání každé účtenky si prostě odečteš <b>pevné % z příjmů</b> jako výdaje. Jednoduchý, oblíbený, legální.</p>
<h3>Kolik % podle typu živnosti</h3>
<ul>
<li><b>60 %</b> – volná živnost (IT, administrativa, grafika, obchod, marketing, překlady…)</li>
<li><b>80 %</b> – vázaná nebo řemeslná živnost</li>
<li><b>40 %</b> – svobodná povolání (architekt, lékař, právník…)</li>
</ul>
<h3>Příklad výpočtu (60 %)</h3>
<ul>
<li>Příjmy: 200 000 Kč</li>
<li>Výdaje (60 %): 120 000 Kč – <i>nemusíš nic dokládat!</i></li>
<li>Základ daně: 80 000 Kč</li>
<li>Daň (15 %): 12 000 Kč</li>
<li>Sleva na poplatníka + studenta: −34 860 Kč</li>
<li><b>Výsledná daň: 0 Kč ✅</b></li>
</ul>
<p>Pokud máš hodně reálných nákladů (notebook, software, kurzy…), zvažte s účetní <b>skutečné výdaje</b> – tam sepisuješ vše, ale potřebuješ doklady.</p>`
  },
  {
    keys: ['pojistn','zdravotní','sociální','ossz','zálohy','vedlejší','hlavní','osvč'],
    title: 'Pojistné – sociální a zdravotní',
    text: `<h3>Klíčový rozdíl: OSVČ vedlejší vs. hlavní</h3>
<p><b>Ty jsi studentka → OSVČ VEDLEJŠÍ</b> 🌸 Tohle je pro tebe obrovská výhoda!</p>
<h3>OSVČ vedlejší (ty, jako studentka do 26 let)</h3>
<ul>
<li><b>Zdravotní zálohy: 0 Kč</b> – jsi pojištěna státem jako studentka!</li>
<li><b>Sociální zálohy: 0 Kč</b> – pokud příjem ze živnosti nepřesáhne <b>111 736 Kč/rok</b> (2024)</li>
<li>Pokud příjem přesáhne limit → minimální záloha na sociální: ~<b>1 496 Kč/měsíc</b></li>
</ul>
<h3>OSVČ hlavní (po ukončení studia)</h3>
<ul>
<li>Sociální zálohy: minimum <b>~3 852 Kč/měsíc</b></li>
<li>Zdravotní zálohy: minimum <b>~2 968 Kč/měsíc</b></li>
<li>Celkem: <b>~6 820 Kč/měsíc</b> povinně</li>
</ul>
<p>⚠️ Po skončení školy musíš změnu oznámit OSSZ a ZP do <b>8 dnů!</b></p>`
  },
  {
    keys: ['dpp','dohoda','provedení','práce','kombinac','zároveň','dvě práce','druhá práce'],
    title: 'DPP + živnost zároveň',
    text: `<h3>Ano, jde to kombinovat – je to legální! ✅</h3>
<p>Máš DPP u dvou firem a zároveň si zakládáš živnost? Žádný problém.</p>
<h3>DPP pravidla (2024)</h3>
<ul>
<li>Do <b>10 000 Kč/měsíc</b> u jednoho zaměstnavatele: bez odvodů (srážková daň nebo daňové přiznání)</li>
<li>Nad 10 001 Kč/měsíc: zaměstnavatel odvede pojistné za tebe</li>
</ul>
<h3>Při kombinaci DPP + živnost</h3>
<ul>
<li>Daňové přiznání podáváš <b>vždy povinně</b></li>
<li>Příjmy z DPP + příjmy ze živnosti se sčítají pro výpočet daně</li>
<li>Zdravotní ze živnosti: <b>0 Kč</b> (studentka → stát platí)</li>
<li>Sociální ze živnosti: dle příjmu (vedlejší OSVČ)</li>
<li>U druhé DPP si dávej pozor, aby zaměstnavatel věděl, že jsi OSVČ – nemá to vliv, ale je dobré mít pořádek</li>
</ul>`
  },
  {
    keys: ['faktur','vystavit','doklad','číslo','duzp','splatnost','záloha','invoice'],
    title: 'Jak vystavit fakturu',
    text: `<h3>Co musí faktura povinně obsahovat</h3>
<ul>
<li><b>Číslo faktury</b> – vlastní číselná řada (např. 2024001, 2024002…)</li>
<li><b>Datum vystavení</b></li>
<li><b>DUZP</b> – datum uskutečnění zdanitelného plnění (kdy jsi práci dokončila)</li>
<li><b>Tvoje údaje:</b> jméno, adresa, <b>IČO</b></li>
<li><b>Odběratel:</b> název firmy, adresa, IČO</li>
<li><b>Popis plnění</b> – co konkrétně jsi dodala</li>
<li><b>Cena</b> – neplátce DPH: jen celková částka bez DPH</li>
<li><b>Způsob platby</b>, číslo účtu, datum splatnosti</li>
</ul>
<h3>Praktické tipy</h3>
<ul>
<li>Jako neplátce DPH (obrat pod 2 mil. Kč/rok) <b>DPH na faktuře neuvádíš</b></li>
<li>Archivuj faktury min. <b>5–10 let</b></li>
<li>Bezplatné nástroje: <b>fakturoid.cz</b> (zkušební verze), <b>billin.eu</b>, nebo Excel šablona</li>
</ul>`
  },
  {
    keys: ['švarc','ileg','nutí','nutit','firma','zaměstnanec','závislá','povinnost','zaměstnanecký'],
    title: 'Firma mě nutí k IČO – co s tím?',
    text: `<h3>Co je švarcsystém?</h3>
<p>Švarcsystém = <b>nelegální praxe</b>, kdy firma nutí lidi pracovat na IČO místo pracovní smlouvy/DPP, i když práce má znaky závislé práce.</p>
<h3>Znaky závislé práce (kde by měla být smlouva)</h3>
<ul>
<li>Pevně stanovená pracovní doba</li>
<li>Práce výhradně na místě a nástroji firmy</li>
<li>Firma řídí a kontroluje práci</li>
<li>Výlučnost – pracuješ jen pro ně</li>
</ul>
<h3>Proč to firmy dělají</h3>
<p>Ušetří <b>~34 % odvodů</b> zaměstnavatele. Pro tebe to znamená vyšší hrubá částka na faktuře, ale veškerá zodpovědnost (daně, odvody) padá na tebe.</p>
<h3>Co doporučuji</h3>
<ul>
<li>Porovnej: co ti nabízejí na faktuře vs. co by ti dali jako DPP – rozdíl bývá malý</li>
<li>Pokud práce skutečně má znaky závislé práce → firma porušuje zákoník práce</li>
<li>V praxi to mnoho lidí akceptuje – je to tvoje rozhodnutí</li>
<li>Při pochybnostech se poraď s <b>pracovněprávním poradcem</b></li>
</ul>`
  },
  {
    keys: ['po škole','ukončení','ukončit','2027','únor','březen','magistr','bakalář','diplom','absolvov'],
    title: 'Co se stane po skončení školy (únor/březen 2027)',
    text: `<h3>⚠️ Povinnosti do 8 dnů po ukončení studia</h3>
<ul>
<li>Oznámit <b>OSSZ</b> (česká správa sociálního zabezpečení), že přestáváš být studentkou</li>
<li>Oznámit svou <b>zdravotní pojišťovnu</b> – stát přestane platit za tebe</li>
</ul>
<h3>Finanční dopad</h3>
<p>Ze <b>OSVČ vedlejší</b> se staneš <b>OSVČ hlavní</b> – přibudou povinné zálohy:</p>
<ul>
<li>Sociální zálohy: minimum <b>~3 852 Kč/měsíc</b></li>
<li>Zdravotní zálohy: minimum <b>~2 968 Kč/měsíc</b></li>
<li>Celkem navíc: <b>~6 820 Kč/měsíc</b></li>
</ul>
<h3>Jak to řešit</h3>

// ── MATCHER ──────────────────────────────────────────────────────────────────
function findAnswer(q) {
  const input = q.toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[?!.,;]/g,' ');

  let best = null, bestScore = 0;
  for (const item of KB) {
    let score = 0;
    for (const key of item.keys) {
      const k = key.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
      if (input.includes(k)) score += k.length;
    }
    if (score > bestScore) { bestScore = score; best = item; }
  }

  if (bestScore === 0) {
    return `<p>Hmm, na tuhle otázku nemám přesnou odpověď v databázi 🌸</p>
<p>Zkus to jinak nebo klikni na jedno z témat nahoře. Případně se poraď s <b>daňovým poradcem nebo účetní</b> – pro konkrétní situace je to vždy nejlepší.</p>`;
  }

  let html = '';
  if (best.title) html += `<h3>${best.title}</h3>`;
  html += best.text;
  return html;
}

// ── DOM ───────────────────────────────────────────────────────────────────────
const msgsEl  = document.getElementById('msgsEl');
const msgIn   = document.getElementById('msgIn');
const sendBtn = document.getElementById('sendBtn');
const themeBtn = document.getElementById('themeBtn');
const petalsEl = document.getElementById('petals');

// ── INIT ──────────────────────────────────────────────────────────────────────
(function init() {
  const chars = ['🌸','🌹','🌺','🌷','💐','🌼','🌻'];
  for (let i = 0; i < 8; i++) {
    const p = document.createElement('span');
    p.className = 'petal';
    p.textContent = chars[i % chars.length];
    p.style.cssText = `left:${Math.random()*100}%;font-size:${1.8+Math.random()*2.5}rem;`
      +`animation-duration:${14+Math.random()*22}s;animation-delay:${Math.random()*-25}s`;
    petalsEl.appendChild(p);
  }
  applyTheme(localStorage.getItem('ruz_theme') || 'light');
  addMsg('bot',
`<p>Ahoj! 🌹 Jsem <b>Ruženka</b>, tvoje offline průvodkyně světem živností v ČR.</p>
<p>Jsem zdarma, funguju bez internetu a vím všechno o:</p>
<ul>
<li>Registraci živnosti a IČO</li>
<li>Daních, slevách a paušálních výdajích</li>
<li>Pojistném pro studentky (vedlejší OSVČ)</li>
<li>Kombinaci DPP + živnost</li>
<li>Co tě čeká po skončení školy</li>
<li>Švarcsystému a firmách nutících k IČO</li>
</ul>
<p>Napiš otázku nebo klikni na téma nahoře 🌸</p>`
  );
  msgIn.focus();
})();

// ── THEME ─────────────────────────────────────────────────────────────────────
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌸';
  localStorage.setItem('ruz_theme', t);
}
themeBtn.addEventListener('click', () => {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});

// ── MESSAGES ──────────────────────────────────────────────────────────────────
function addMsg(role, html) {
  const row = document.createElement('div');
  row.className = `row ${role === 'bot' ? 'b' : 'u'}`;

  const av = document.createElement('div');
  av.className = 'av'; av.setAttribute('aria-hidden','true');
  av.textContent = role === 'bot' ? '🌹' : '👩';

  const bub = document.createElement('div');
  bub.className = 'bub';
  if (role === 'user') {
    // user text: escape and show as-is
    const p = document.createElement('p');
    p.textContent = html;
    bub.appendChild(p);
  } else {
    bub.innerHTML = html;
  }

  row.appendChild(av); row.appendChild(bub);
  msgsEl.appendChild(row);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'typing-row'; row.id = 'typRow';
  const av = document.createElement('div'); av.className = 'av'; av.textContent = '🌹';
  const bub = document.createElement('div'); bub.className = 'typing-bub';
  bub.innerHTML = '<div class="td"></div><div class="td"></div><div class="td"></div>';
  row.appendChild(av); row.appendChild(bub);
  msgsEl.appendChild(row);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}
function hideTyping() { document.getElementById('typRow')?.remove(); }

// ── SEND ──────────────────────────────────────────────────────────────────────
function send() {
  const q = msgIn.value.trim();
  if (!q) return;
  addMsg('user', q);
  msgIn.value = ''; msgIn.style.height = 'auto';
  showTyping();
  setTimeout(() => {
    hideTyping();
    addMsg('bot', findAnswer(q));
  }, 400 + Math.random() * 300);
}

sendBtn.addEventListener('click', send);
msgIn.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
msgIn.addEventListener('input', () => {
  msgIn.style.height = 'auto';
  msgIn.style.height = Math.min(msgIn.scrollHeight, 160) + 'px';
});
document.querySelectorAll('.chip').forEach(b => {
  b.addEventListener('click', () => { msgIn.value = b.dataset.q; send(); });
});
</script>

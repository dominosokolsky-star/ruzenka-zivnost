<!DOCTYPE html>
<html lang="cs" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌹 Ruženka – Živnostenský Pomocník</title>
<style>
:root{--bg:#fff1f3;--surface:#fff;--surface2:#ffe4e8;--border:#fecdd5;--primary:#e11d48;--primary-h:#be123c;--primary-l:#fda4b1;--text:#1a0a0f;--text2:#6b3344;--muted:#9f6070;--user-bg:#e11d48;--user-fg:#fff;--bot-bg:#fff;--bot-fg:#1a0a0f;--shadow:0 4px 24px rgba(225,29,72,.12);--shadow-s:0 2px 8px rgba(225,29,72,.08);--r:16px;--rs:8px}
[data-theme="dark"]{--bg:#110409;--surface:#1e0b13;--surface2:#2d1221;--border:#5c1d30;--primary:#f43f5e;--primary-h:#fb7089;--primary-l:#9f1239;--text:#fdf2f5;--text2:#f9a8ba;--muted:#c8849a;--user-bg:#be123c;--user-fg:#fff;--bot-bg:#2d1221;--bot-fg:#fdf2f5;--shadow:0 4px 24px rgba(244,63,94,.22);--shadow-s:0 2px 8px rgba(244,63,94,.15)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;line-height:1.55}
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.petal{position:absolute;bottom:-80px;font-size:3rem;opacity:.05;animation:rise linear infinite;user-select:none}
@keyframes rise{from{transform:translateY(0) rotate(0deg);opacity:0}8%{opacity:.05}92%{opacity:.05}to{transform:translateY(-110vh) rotate(360deg);opacity:0}}
.theme-btn{position:fixed;top:1rem;right:1rem;z-index:200;background:var(--surface);border:1.5px solid var(--border);border-radius:50%;width:44px;height:44px;cursor:pointer;font-size:1.25rem;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-s);transition:transform .2s}
.theme-btn:hover{transform:scale(1.1)}
.theme-btn:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.hdr{width:100%;max-width:860px;padding:1.75rem 1.5rem .75rem;text-align:center;position:relative;z-index:1}
.hdr-rose{font-size:3rem;display:block;margin-bottom:.4rem;filter:drop-shadow(0 2px 10px rgba(225,29,72,.35))}
.hdr h1{font-size:1.7rem;font-weight:800;letter-spacing:-.025em;background:linear-gradient(135deg,var(--primary),var(--primary-h));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hdr p{color:var(--muted);font-size:.875rem;margin-top:.25rem}
.chat{width:100%;max-width:860px;flex:1;display:flex;flex-direction:column;padding:0 1rem 1rem;position:relative;z-index:1;gap:.7rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{background:var(--surface);border:1.5px solid var(--border);border-radius:20px;padding:.32rem .85rem;font-size:.78rem;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .18s;white-space:nowrap}
.chip:hover{background:var(--primary);color:#fff;border-color:var(--primary);transform:translateY(-1px);box-shadow:var(--shadow-s)}
.chip:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.msgs{flex:1;overflow-y:auto;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:1.4rem;min-height:420px;max-height:58vh;display:flex;flex-direction:column;gap:1.25rem;box-shadow:var(--shadow);scroll-behavior:smooth}
.msgs::-webkit-scrollbar{width:5px}
.msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.row{display:flex;gap:.7rem;animation:fadeUp .28s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.row.u{flex-direction:row-reverse;align-self:flex-end;max-width:80%}
.row.b{align-self:flex-start;max-width:86%}
.av{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.1rem;background:var(--surface2);border:1.5px solid var(--border)}
.bub{padding:.75rem 1.05rem;border-radius:var(--r);font-size:.875rem;line-height:1.7;word-break:break-word}
.row.u .bub{background:var(--user-bg);color:var(--user-fg);border-radius:var(--r) var(--r) 4px var(--r)}
.row.b .bub{background:var(--bot-bg);color:var(--bot-fg);border:1.5px solid var(--border);border-radius:var(--r) var(--r) var(--r) 4px}
.bub b{font-weight:700;color:var(--primary)}
.row.u .bub b{color:rgba(255,255,255,.95)}
.bub h3{font-size:.95rem;font-weight:700;color:var(--primary);margin:.7rem 0 .35rem}
.bub h3:first-child{margin-top:0}
.bub ul{padding-left:1.35rem;margin:.35rem 0}
.bub li{margin-bottom:.25rem}
.bub p{margin-bottom:.45rem}
.bub p:last-child{margin-bottom:0}
.typing-row{display:flex;gap:.7rem;align-self:flex-start;animation:fadeUp .28s ease-out}
.typing-bub{background:var(--bot-bg);border:1.5px solid var(--border);border-radius:var(--r) var(--r) var(--r) 4px;padding:.85rem 1.1rem;display:flex;gap:5px;align-items:center}
.td{width:8px;height:8px;background:var(--primary-l);border-radius:50%;animation:tdB 1.4s ease-in-out infinite}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes tdB{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-7px);opacity:1}}
.inp-row{display:flex;gap:.65rem;align-items:flex-end}
.inp-wrap{flex:1}
.inp-wrap textarea{width:100%;padding:.82rem 1rem;border:1.5px solid var(--border);border-radius:var(--rs);background:var(--surface);color:var(--text);font-size:.875rem;font-family:inherit;resize:none;min-height:52px;max-height:160px;overflow-y:auto;transition:border-color .2s,box-shadow .2s;line-height:1.5}
.inp-wrap textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(225,29,72,.1)}
.inp-wrap textarea::placeholder{color:var(--muted)}
.send-btn{width:52px;height:52px;flex-shrink:0;background:var(--primary);color:#fff;border:none;border-radius:var(--rs);font-size:1.35rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .1s,box-shadow .2s}
.send-btn:hover:not(:disabled){background:var(--primary-h);transform:translateY(-1px);box-shadow:var(--shadow-s)}
.send-btn:active:not(:disabled){transform:scale(.95)}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
.send-btn:focus-visible{outline:2px solid var(--primary-h);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:600px){.hdr h1{font-size:1.35rem}.chips{gap:.35rem}.chip{font-size:.73rem;padding:.28rem .7rem}.msgs{min-height:340px;max-height:50vh;padding:1rem}.row.u,.row.b{max-width:93%}}
</style>
</head>
<body>
<div class="petals" aria-hidden="true" id="petals"></div>

      <button class="chip" data-q="jak vystavit fakturu">🧾 Faktura / Faktúra</button>
      <button class="chip" data-q="firma mě nutí k ičo švarcsystém">⚠️ Firma nutí k IČO</button>
      <button class="chip" data-q="kolik vydělám čistého">🔢 Čistý příjem / Príjem</button>

    </div>
    <button class="send-btn" id="sendBtn" aria-label="Odeslat" title="Odeslat">🌹</button>
  </div>
</main>

// ── LANGUAGE DETECTION ────────────────────────────────────────────────────────
function isSlovak(q) {
  // Slovak-exclusive characters
  if (/[ľŕĺä]/.test(q)) return true;
  const n = norm(q);
  const sk = ['kolko','chcem','potrebujem','vydavky','poistne','odvody',
               'zarobim','zarobis','registracia','mozem','neviem',' viem ',
               'poistu','prihlas sa','ako sa','ako si',' ako ','aky ','ake ',
               'zivnost','zivnostnik','podnikanie','zamestnanie','pracovat'];
  const cz = ['kolik','chci','potrebuji','vydaje','pojistne','vydelam',
               'jsem','mohu','muzem','nevim','jak se','jak si',' jak '];
  const skHits = sk.filter(w => n.includes(w)).length;
  const czHits = cz.filter(w => n.includes(w)).length;
  return skHits > czHits;
}

// ── NORMALIZER ────────────────────────────────────────────────────────────────
function norm(s) {
  return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
          .replace(/[?!.,;:()]/g,' ').replace(/\s+/g,' ').trim();
}

// ── MATCHER ───────────────────────────────────────────────────────────────────
function findAnswer(q) {
  const n = norm(q);
  const words = n.split(/\s+/).filter(w => w.length > 2);

  let best = null, bestScore = 0;

  for (const item of KB) {
    let score = 0;
    for (const key of item.keys) {
      const k = norm(key);
      if (!k) continue;

      // Full phrase match — highest weight
      if (n.includes(k)) {
        score += k.length * 3;
        continue;
      }
      // Word-level partial match — catches typos and short queries
      for (const w of words) {
        if (w.length < 3) continue;
        if (w.includes(k) || k.includes(w)) {
          score += Math.min(w.length, k.length) * 1.5;
        }
      }
    }
    if (score > bestScore) { bestScore = score; best = item; }
  }

  const sk = isSlovak(q);

  if (bestScore < 4 || !best) {
    return sk
      ? `<p>Hmm, na túto otázku nemám presnú odpoveď 🌸</p><p>Skús to inak alebo klikni na tému vyššie. Pre konkrétne situácie odporúčam konzultáciu s <b>daňovým poradcom</b>.</p>`
      : `<p>Hmm, na tuhle otázku nemám přesnou odpověď 🌸</p><p>Zkus to jinak nebo klikni na téma nahoře. Pro konkrétní situace doporuč konzultaci s <b>daňovým poradcem</b>.</p>`;
  }

  return sk && best.textSK ? best.textSK : best.text;
}

const themeBtn = document.getElementById('themeBtn');
const petalsEl = document.getElementById('petals');

// ── INIT ──────────────────────────────────────────────────────────────────────
(function init(){
  const chars=['🌸','🌹','🌺','🌷','💐','🌼','🌻'];
  for(let i=0;i<8;i++){
    const p=document.createElement('span'); p.className='petal';
    p.textContent=chars[i%chars.length];
    p.style.cssText=`left:${Math.random()*100}%;font-size:${1.8+Math.random()*2.5}rem;`
      +`animation-duration:${14+Math.random()*22}s;animation-delay:${Math.random()*-25}s`;
    petalsEl.appendChild(p);
  }
  applyTheme(localStorage.getItem('ruz_theme')||'light');
  addMsg('bot',
`<p>Ahoj! 🌹 Som <b>Ruženka</b> / Jsem <b>Ruženka</b> – tvoja sprievodkyňa svetom živností v ČR.</p>
<p>Rozumiem <b>česky aj slovensky</b> 🇨🇿🇸🇰 – píš ako chceš, pochopím ťa aj pri chybách alebo vágnych otázkach.</p>
<p>Viem ti poradiť s:</p>
<ul>
<li>Registráciou živnosti / Registrací živnosti</li>
<li>Daňami, zľavami, paušálnymi výdavkami</li>
<li>Poistným pre študentky (vedľajšia OSVČ / SZČO)</li>
<li>Kombináciou DPP + živnosť</li>
<li>Faktúrami, švarcsystémom, životom po škole</li>
</ul>
<p>Napíš otázku alebo klikni na tému vyššie 🌸</p>`
  );
  msgIn.focus();
})();

function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  themeBtn.textContent=t==='dark'?'☀️':'🌸';
  localStorage.setItem('ruz_theme',t);
}
themeBtn.addEventListener('click',()=>{
  applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
});

function addMsg(role,html){
  const row=document.createElement('div'); row.className=`row ${role==='bot'?'b':'u'}`;
  const av=document.createElement('div'); av.className='av'; av.setAttribute('aria-hidden','true');
  av.textContent=role==='bot'?'🌹':'👩';
  const bub=document.createElement('div'); bub.className='bub';
  if(role==='user'){const p=document.createElement('p'); p.textContent=html; bub.appendChild(p);}
  else bub.innerHTML=html;
  row.appendChild(av); row.appendChild(bub);
  msgsEl.appendChild(row); msgsEl.scrollTop=msgsEl.scrollHeight;
}

function showTyping(){
  const row=document.createElement('div'); row.className='typing-row'; row.id='typRow';
  const av=document.createElement('div'); av.className='av'; av.textContent='🌹';
  const bub=document.createElement('div'); bub.className='typing-bub';
  bub.innerHTML='<div class="td"></div><div class="td"></div><div class="td"></div>';
  row.appendChild(av); row.appendChild(bub); msgsEl.appendChild(row);
  msgsEl.scrollTop=msgsEl.scrollHeight;
}
function hideTyping(){ document.getElementById('typRow')?.remove(); }

function send(){
  const q=msgIn.value.trim(); if(!q) return;
  addMsg('user',q); msgIn.value=''; msgIn.style.height='auto';
  showTyping();
  setTimeout(()=>{ hideTyping(); addMsg('bot',findAnswer(q)); }, 350+Math.random()*250);
}

sendBtn.addEventListener('click',send);
msgIn.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} });
msgIn.addEventListener('input',()=>{ msgIn.style.height='auto'; msgIn.style.height=Math.min(msgIn.scrollHeight,160)+'px'; });
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{msgIn.value=b.dataset.q;send();}));
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌹 Rúženka – Živnostenský Pomocník</title>
<style>
:root{--bg:#fff1f3;--surface:#fff;--surface2:#ffe4e8;--border:#fecdd5;--primary:#e11d48;--primary-h:#be123c;--primary-l:#fda4b1;--text:#1a0a0f;--text2:#6b3344;--muted:#9f6070;--user-bg:#e11d48;--user-fg:#fff;--bot-bg:#fff;--bot-fg:#1a0a0f;--shadow:0 4px 24px rgba(225,29,72,.12);--shadow-s:0 2px 8px rgba(225,29,72,.08);--r:16px;--rs:8px}
[data-theme="dark"]{--bg:#110409;--surface:#1e0b13;--surface2:#2d1221;--border:#5c1d30;--primary:#f43f5e;--primary-h:#fb7089;--primary-l:#9f1239;--text:#fdf2f5;--text2:#f9a8ba;--muted:#c8849a;--user-bg:#be123c;--user-fg:#fff;--bot-bg:#2d1221;--bot-fg:#fdf2f5;--shadow:0 4px 24px rgba(244,63,94,.22);--shadow-s:0 2px 8px rgba(244,63,94,.15)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;line-height:1.55}
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.petal{position:absolute;bottom:-80px;font-size:3rem;opacity:.05;animation:rise linear infinite;user-select:none}
@keyframes rise{from{transform:translateY(0) rotate(0deg);opacity:0}8%{opacity:.05}92%{opacity:.05}to{transform:translateY(-110vh) rotate(360deg);opacity:0}}
.theme-btn{position:fixed;top:1rem;right:1rem;z-index:200;background:var(--surface);border:1.5px solid var(--border);border-radius:50%;width:44px;height:44px;cursor:pointer;font-size:1.25rem;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-s);transition:transform .2s}
.theme-btn:hover{transform:scale(1.1)}
.theme-btn:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.hdr{width:100%;max-width:860px;padding:1.75rem 1.5rem .75rem;text-align:center;position:relative;z-index:1}
.hdr-rose{font-size:3rem;display:block;margin-bottom:.4rem;filter:drop-shadow(0 2px 10px rgba(225,29,72,.35))}
.hdr h1{font-size:1.7rem;font-weight:800;letter-spacing:-.025em;background:linear-gradient(135deg,var(--primary),var(--primary-h));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hdr p{color:var(--muted);font-size:.875rem;margin-top:.25rem}
.chat{width:100%;max-width:860px;flex:1;display:flex;flex-direction:column;padding:0 1rem 1rem;position:relative;z-index:1;gap:.7rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{background:var(--surface);border:1.5px solid var(--border);border-radius:20px;padding:.32rem .85rem;font-size:.78rem;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .18s;white-space:nowrap}
.chip:hover{background:var(--primary);color:#fff;border-color:var(--primary);transform:translateY(-1px);box-shadow:var(--shadow-s)}
.chip:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.msgs{flex:1;overflow-y:auto;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:1.4rem;min-height:420px;max-height:58vh;display:flex;flex-direction:column;gap:1.25rem;box-shadow:var(--shadow);scroll-behavior:smooth}
.msgs::-webkit-scrollbar{width:5px}
.msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.row{display:flex;gap:.7rem;animation:fadeUp .28s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.row.u{flex-direction:row-reverse;align-self:flex-end;max-width:80%}
.row.b{align-self:flex-start;max-width:86%}
.av{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.1rem;background:var(--surface2);border:1.5px solid var(--border)}
.bub{padding:.75rem 1.05rem;border-radius:var(--r);font-size:.875rem;line-height:1.7;word-break:break-word}
.row.u .bub{background:var(--user-bg);color:var(--user-fg);border-radius:var(--r) var(--r) 4px var(--r)}
.row.b .bub{background:var(--bot-bg);color:var(--bot-fg);border:1.5px solid var(--border);border-radius:var(--r) var(--r) var(--r) 4px}
.bub b{font-weight:700;color:var(--primary)}
.row.u .bub b{color:rgba(255,255,255,.95)}
.bub h3{font-size:.95rem;font-weight:700;color:var(--primary);margin:.7rem 0 .35rem}
.bub h3:first-child{margin-top:0}
.bub ul{padding-left:1.35rem;margin:.35rem 0}
.bub li{margin-bottom:.25rem}
.bub p{margin-bottom:.45rem}
.bub p:last-child{margin-bottom:0}
.typing-row{display:flex;gap:.7rem;align-self:flex-start;animation:fadeUp .28s ease-out}
.typing-bub{background:var(--bot-bg);border:1.5px solid var(--border);border-radius:var(--r) var(--r) var(--r) 4px;padding:.85rem 1.1rem;display:flex;gap:5px;align-items:center}
.td{width:8px;height:8px;background:var(--primary-l);border-radius:50%;animation:tdB 1.4s ease-in-out infinite}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes tdB{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-7px);opacity:1}}
.inp-row{display:flex;gap:.65rem;align-items:flex-end}
.inp-wrap{flex:1}
.inp-wrap textarea{width:100%;padding:.82rem 1rem;border:1.5px solid var(--border);border-radius:var(--rs);background:var(--surface);color:var(--text);font-size:.875rem;font-family:inherit;resize:none;min-height:52px;max-height:160px;overflow-y:auto;transition:border-color .2s,box-shadow .2s;line-height:1.5}
.inp-wrap textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(225,29,72,.1)}
.inp-wrap textarea::placeholder{color:var(--muted)}
.send-btn{width:52px;height:52px;flex-shrink:0;background:var(--primary);color:#fff;border:none;border-radius:var(--rs);font-size:1.35rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .1s,box-shadow .2s}
.send-btn:hover:not(:disabled){background:var(--primary-h);transform:translateY(-1px);box-shadow:var(--shadow-s)}
.send-btn:active:not(:disabled){transform:scale(.95)}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
.send-btn:focus-visible{outline:2px solid var(--primary-h);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.clear-btn{background:none;border:1.5px solid var(--border);border-radius:var(--rs);padding:.28rem .8rem;font-size:.75rem;color:var(--muted);cursor:pointer;font-family:inherit;transition:all .18s;align-self:center}
.clear-btn:hover{background:var(--surface2);color:var(--text);border-color:var(--primary-l)}
.inp-hint{font-size:.72rem;color:var(--muted);padding:.25rem .2rem 0;user-select:none}
.disclaimer{width:100%;max-width:860px;padding:.25rem 1.5rem 1rem;text-align:center;font-size:.72rem;color:var(--muted);position:relative;z-index:1;line-height:1.5}
.bub a{color:var(--primary);text-decoration:none;font-weight:600;border-bottom:1.5px solid var(--primary-l);transition:color .15s,border-color .15s}
.bub a:hover{color:var(--primary-h);border-bottom-color:var(--primary)}
.calc-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:.9rem 1rem;margin:.6rem 0}
.calc-card h4{font-size:.84rem;font-weight:700;color:var(--primary);margin-bottom:.1rem}
.calc-sub{font-size:.72rem;color:var(--muted);margin:.1rem 0 .5rem;line-height:1.4}
.calc-row{display:flex;justify-content:space-between;align-items:baseline;font-size:.8rem;padding:.22rem 0;border-bottom:1px solid var(--border)}
.calc-row:last-child{border-bottom:none;padding-top:.4rem}
.calc-vals{text-align:right;font-variant-numeric:tabular-nums;line-height:1.35}
.calc-yr{display:block;font-size:.68rem;color:var(--muted);font-weight:400}
.calc-net{font-weight:700}.calc-net .calc-vals{color:var(--primary)}
@media(max-width:600px){.hdr h1{font-size:1.35rem}.chips{gap:.35rem}.chip{font-size:.73rem;padding:.28rem .7rem}.msgs{min-height:340px;max-height:50vh;padding:1rem}.row.u,.row.b{max-width:93%}}
</style>
</head>
<body>
<div class="petals" aria-hidden="true" id="petals"></div>
<button class="theme-btn" id="themeBtn" aria-label="Přepnout téma">🌸</button>
<header class="hdr">
  <span class="hdr-rose" aria-hidden="true">🌹</span>
  <h1>Živnostenský Pomocník</h1>
  <p>Průvodkyně světem živností v ČR 🇨🇿 · rozumí česky i slovensky 🇸🇰 · zdarma &amp; offline</p>
</header>
<main class="chat" aria-label="Chatbot Rúženka">
  <nav aria-label="Rychlá témata">
    <div style="display:flex;align-items:flex-start;gap:.6rem;flex-wrap:wrap">
    <div class="chips" role="list" style="flex:1">
      <button class="chip" data-q="jak zaregistrovat živnost">📋 Registrace</button>
      <button class="chip" data-q="jak vyplnit jrf formulář části a b c d e">📝 JRF formulář</button>
      <button class="chip" data-q="jaké daně musím platit">💰 Daně</button>
      <button class="chip" data-q="pojistné studentka osvč vedlejší">🏥 Pojistné</button>
      <button class="chip" data-q="dpp a živnost zároveň">📄 DPP + živnost</button>
      <button class="chip" data-q="co jsou paušální výdaje">🧾 Paušální výdaje</button>
      <button class="chip" data-q="co se stane po skončení školy">🎓 Po škole</button>
      <button class="chip" data-q="jak vystavit fakturu">🧾 Faktura</button>
      <button class="chip" data-q="firma mě nutí k ičo švarcsystém">⚠️ Firma nutí k IČO</button>
      <button class="chip" data-q="vydělávám 40000 měsíčně kolik zaplatím">🧮 Kalkulačka</button>
      <button class="chip" data-q="co je ičo a kde ho najdu">🔢 IČO / DIČ</button>
      <button class="chip" data-q="výhody a nevýhody živnosti">⚖️ Výhody vs. nevýhody</button>
      <button class="chip" data-q="home office daňový výdaj">🏠 Home office</button>
      <button class="chip" data-q="sociální zálohy ossz přehled">📊 Sociální pojišťovna</button>
      <button class="chip" data-q="zdravotní zálohy vzp přehled">💊 Zdravotní pojišťovna</button>
      <button class="chip" data-q="jak podat daňové přiznání">📑 Daňové přiznání</button>
      <button class="chip" data-q="co si mohu odečíst jako výdaj">💳 Daňové výdaje</button>
      <button class="chip" data-q="první kroky checklist živnost">✅ První kroky</button>
      <button class="chip" data-q="živnost vs sro kdy přejít">🏢 Živnost vs. s.r.o.</button>
      <button class="chip" data-q="zahraniční klient faktura">🌍 Zahraniční klient</button>
      <button class="chip" data-q="jak nastavit hodinovou sazbu cenu">💡 Jak nastavit cenu</button>
      <button class="chip" data-q="časté chyby živnostník">❌ Časté chyby</button>
      <button class="chip" data-q="datová schránka co je jak zřídit">📬 Datová schránka</button>
      <button class="chip" data-q="tipy jak ušetřit na daních">💎 Daňové úspory</button>
    </div>
    <button class="clear-btn" id="clearBtn" title="Vymazat chat">🗑 Vymazat</button>
    </div>
  </nav>
  <div class="msgs" id="msgsEl" role="log" aria-live="polite"></div>
  <div class="inp-row">
    <div class="inp-wrap">
      <label for="msgIn" class="sr">Napiš zprávu</label>
      <textarea id="msgIn" rows="1" placeholder="Napiš otázku česky nebo slovensky… 🌸"></textarea>
    </div>
    <button class="send-btn" id="sendBtn" aria-label="Odeslat" title="Odeslat">🌹</button>
  </div>
  <div class="inp-hint">Enter = odeslat &nbsp;·&nbsp; Shift+Enter = nový řádek</div>
</main>
<footer class="disclaimer">
  ℹ️ Informace jsou orientační pro rok 2025. Vždy ověř aktuální částky na <a href="https://www.gov.cz/" target="_blank" rel="noopener" style="color:inherit;font-weight:600">gov.cz</a> nebo s daňovým poradcem.
</footer>

  return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')

}

function extractAmount(q) {
  // "100 tisíc", "100 tisic", "100tisic"
  let m = q.match(/(\d+[\.,]?\d*)\s*tis[íi]c/i);
  if (m) return Math.round(parseFloat(m[1].replace(',','.')) * 1000);
  // "100k", "40K", "1.5k"
  m = q.replace(/\s/g,'').match(/(\d+[\.,]?\d*)[kK](?!\w)/);
  if (m) return Math.round(parseFloat(m[1].replace(',','.')) * 1000);
  // "100 000" or "100.000" or "100,000" (thousands separator)
  m = q.match(/(\d{1,3})[.\s,](\d{3})(?!\d)/);
  if (m) return +(m[1] + m[2]);
  // plain 4–7 digit number: "40000", "100000"
  m = q.match(/\b(\d{4,7})\b/);
  if (m) return +m[1];
  // plain 3-digit like "500" interpreted as hundreds (rare but allow "500 Kč" fails – skip)
  return null;
}

function isIncomeQuery(n) {
  // Normalised string – diacritics already stripped by norm()
  const triggers = [
    // Czech
    'vydel','zarobi','zarabi','prijem','mesicne','mesicni','rocne','rocni',
    'za mesic','za rok','vydelek','dostav','beru','fakturuj','fakturuji',
    'odvedu','odvody','kolik dan','kolik zaplatim','budu platit','cisty',
    'hrub','dan z','zaplatit','vypocit','kalkulac','kolko',
    // Slovak
    'mesacne','mesacni','rocne','kolko','zarobim','zaplatim',
    // English
    'earn','income','month','monthly','annual','yearly','salary',
    'per month','per year','per hour','hourly',
    // Currency keywords (normalised: č→c, etc.)
    'czk','kc','korun','crown','euro','usd',
    // Generic "how much"
    'kolik','kolko'
  ];
  return triggers.some(w => n.includes(w));
}

function calcScenario(annual, pausRate, isStudent, isVedlejsi) {
  const vydaje = Math.round(annual * pausRate);
  const zaklad = annual - vydaje;
  const tax = Math.max(0, Math.round(zaklad * C.tax - C.credPopl - (isStudent ? C.credStud : 0)));
  const vym = zaklad * C.vymBase;
  let soc, hlth;
  if (isVedlejsi) {
    hlth = 0; // covered by state (student) or employer
    soc = zaklad <= C.vedlejsiLim ? 0 : Math.round(vym * C.socRate);
  } else {
    soc  = Math.max(C.minSocHlavni,  Math.round(vym * C.socRate));
    hlth = Math.max(C.minHlthHlavni, Math.round(vym * C.hlthRate));
  }
  const total = tax + soc + hlth;
  return { annual, vydaje, zaklad, tax, soc, hlth, total, net: annual - total };
}

function czk(n) { return Math.round(n).toLocaleString('cs-CZ') + ' Kč'; }

function calcCard(label, sub, s) {
  const mo = v => czk(v/12);
  const row = (name, val, cls='') =>
    `<div class="calc-row ${cls}"><span>${name}</span><span class="calc-vals">${mo(val)}<span class="calc-yr">${czk(val)}/rok</span></span></div>`;
  return `<div class="calc-card">
<h4>${label}</h4><p class="calc-sub">${sub}</p>
${row('Hrubý příjem', s.annual)}
${row('Paušální výdaje', -s.vydaje)}
${row('Základ daně', s.zaklad)}
${row('Daň z příjmů', s.tax)}
${row('Sociální pojistné', s.soc)}
${row('Zdravotní pojistné', s.hlth)}
${row('✅ Čistý příjem', s.net, 'calc-net')}
</div>`;
}

function tryCalc(q) {
  const n = norm(q);
  if (!isIncomeQuery(n)) return null;
  const amount = extractAmount(q);
  if (!amount || amount < 3000 || amount > 6000000) return null;
  const isAnnual = /ro[cč]n|za rok/i.test(q);
  const annual = isAnnual ? amount : amount * 12;
  const monthly = Math.round(annual / 12);

  const sA = calcScenario(annual, 0.60, true,  true);   // studentka vedlejší 60%
  const sB = calcScenario(annual, 0.80, true,  true);   // studentka vedlejší 80%
  const sC = calcScenario(annual, 0.60, false, false);  // hlavní OSVČ 60%
  const sD = calcScenario(annual, 0.60, false, true);   // po škole + job = vedlejší 60%

  return `<p>🧮 <b>Kalkulace pro ${czk(monthly)}/měsíc</b> (${czk(annual)}/rok)</p>
<p style="font-size:.75rem;color:var(--muted)">Hodnoty jsou měsíční · v závorce roční · rok 2025</p>
${calcCard('A – Studentka, vedlejší OSVČ, paušál 60%',
  'Volná živnost: IT, grafika, marketing, překlady, copywriting…', sA)}
${calcCard('B – Studentka, vedlejší OSVČ, paušál 80%',
  'Řemeslná živnost: stavebnictví, elektrikář, instalatér…', sB)}
${calcCard('C – Po škole, hlavní OSVČ, paušál 60%',
  'Bez zaměstnání – platíš minimální zálohy (~6 820 Kč/měs)', sC)}
${calcCard('D – Po škole + zaměstnání, vedlejší OSVČ, paušál 60%',
  'Souběžně pracuješ jako zaměstnanec – zpět na vedlejší, nižší odvody', sD)}
<p style="font-size:.73rem;color:var(--muted);margin-top:.4rem">⚠️ Orientační výpočet. Slevy: poplatník 30 840 Kč + student 4 020 Kč. Více na <a href="https://www.financnisprava.cz/" target="_blank" rel="noopener">financnisprava.cz</a>.</p>`;
}

// ── MATCHER ───────────────────────────────────────────────────────────────────
function findAnswer(q) {
  const calc = tryCalc(q);
  if (calc) return calc;

  const n = norm(q);
  const words = n.split(/\s+/).filter(w => w.length > 2);

  let best = null, bestScore = 0;

  for (const item of KB) {
    let score = 0;
    for (const key of item.keys) {
      const k = norm(key);
      if (!k) continue;

      // Full phrase match — highest weight
      if (n.includes(k)) {
        score += k.length * 3;
        continue;
      }
      // Word-level partial match — catches typos and short queries
      for (const w of words) {
        if (w.length < 3) continue;
        if (k.length < 4) continue; // skip very short keys to avoid greedy false matches
        if (w.includes(k) || k.includes(w)) {
          score += Math.min(w.length, k.length) * 1.5;
        }
      }
    }
    if (score > bestScore) { bestScore = score; best = item; }
  }

  if (bestScore < 4 || !best) {
    return `<p>Hmm, na tuhle otázku nemám přesnou odpověď 🌸</p><p>Zkus to jinak nebo klikni na téma nahoře. Pro konkrétní situace doporuč konzultaci s <b>daňovým poradcem</b>.</p>`;
  }

  return best.text;
}

const msgsEl   = document.getElementById('msgsEl');
const msgIn    = document.getElementById('msgIn');
const sendBtn  = document.getElementById('sendBtn');
const themeBtn = document.getElementById('themeBtn');
const petalsEl = document.getElementById('petals');

// ── INIT ──────────────────────────────────────────────────────────────────────
(function init(){
  const chars=['🌸','🌹','🌺','🌷','💐','🌼','🌻'];
  for(let i=0;i<8;i++){
    const p=document.createElement('span'); p.className='petal';
    p.textContent=chars[i%chars.length];
    p.style.cssText=`left:${Math.random()*100}%;font-size:${1.8+Math.random()*2.5}rem;`
      +`animation-duration:${14+Math.random()*22}s;animation-delay:${Math.random()*-25}s`;
    petalsEl.appendChild(p);
  }
  applyTheme(localStorage.getItem('ruz_theme')||'light');
  addMsg('bot',
`<p>Ahoj! 🌹 Jsem <b>Rúženka</b>, tvoje průvodkyně světem živností v ČR.</p>
<p>Rozumím <b>česky i slovensky</b> 🇨🇿🇸🇰 – piš jak chceš, pochopím tě i při chybách nebo vágních otázkách.</p>
<p>Poradím ti s:</p>
<ul>
<li>Registrací živnosti a získáním IČO</li>
<li>Daněmi, slevami, paušálními výdaji</li>
<li>Pojistným pro studentky (vedlejší OSVČ)</li>
<li>Kombinací DPP + živnost</li>
<li>Fakturami, švarcsystémem, životem po škole</li>
<li>🧮 <b>Kalkulačka</b> – napiš třeba <i>"vydělávám 40 000 měsíčně"</i> a ukážu ti daně a odvody ve všech scénářích</li>
</ul>
<p>Napiš otázku nebo klikni na téma nahoře 🌸</p>`
  );
  msgIn.focus();
})();

function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  themeBtn.textContent=t==='dark'?'☀️':'🌸';
  localStorage.setItem('ruz_theme',t);
}
themeBtn.addEventListener('click',()=>{
  applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
});

function addMsg(role,html){
  const row=document.createElement('div'); row.className=`row ${role==='bot'?'b':'u'}`;
  const av=document.createElement('div'); av.className='av'; av.setAttribute('aria-hidden','true');
  av.textContent=role==='bot'?'🌹':'👩';
  const bub=document.createElement('div'); bub.className='bub';
  if(role==='user'){const p=document.createElement('p'); p.textContent=html; bub.appendChild(p);}
  else bub.innerHTML=html;
  row.appendChild(av); row.appendChild(bub);
  msgsEl.appendChild(row); msgsEl.scrollTop=msgsEl.scrollHeight;
}

function showTyping(){
  const row=document.createElement('div'); row.className='typing-row'; row.id='typRow';
  const av=document.createElement('div'); av.className='av'; av.textContent='🌹';
  const bub=document.createElement('div'); bub.className='typing-bub';
  bub.innerHTML='<div class="td"></div><div class="td"></div><div class="td"></div>';
  row.appendChild(av); row.appendChild(bub); msgsEl.appendChild(row);
  msgsEl.scrollTop=msgsEl.scrollHeight;
}
function hideTyping(){ document.getElementById('typRow')?.remove(); }

function send(){
  const q=msgIn.value.trim(); if(!q) return;
  addMsg('user',q); msgIn.value=''; msgIn.style.height='auto';
  showTyping();
  setTimeout(()=>{ hideTyping(); addMsg('bot',findAnswer(q)); }, 350+Math.random()*250);
}

sendBtn.addEventListener('click',send);
msgIn.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} });
msgIn.addEventListener('input',()=>{ msgIn.style.height='auto'; msgIn.style.height=Math.min(msgIn.scrollHeight,160)+'px'; });
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{msgIn.value=b.dataset.q;send();}));
document.getElementById('clearBtn').addEventListener('click',()=>{
  msgsEl.innerHTML='';
  addMsg('bot',`<p>Chat vymazán 🌸 Na co se chceš zeptat?</p>`);
});
</script>
